name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Copy & Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk WebTree.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebTree-Android-Debug-APK
          path: WebTree.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "WebTree Android App (Direct APK)"
          body: |
            ### 📱 WebTree Mobile Android APK
            - **App Name:** WebTree
            - **Format:** Direct Android APK (`.apk`)
            - **Installation:** Download and tap to install directly on Android.
          files: WebTree.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
